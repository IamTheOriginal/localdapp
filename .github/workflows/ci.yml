name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = the oldest Node the web app's tooling supports; 25 = what the keeper image
        # (Dockerfile.headless) and local development run. The keeper needs >= 23.6.
        node-version: [22, 25]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # The production bundle is what gets deployed; a build that only breaks in `vite build`
      # (chunking, asset imports) must fail here, not on the deploy.
      - run: npm run build
      # Boots the real keeper entry point against a throwaway data directory.
      - if: matrix.node-version == 25
        run: npm run smoke:keeper
